# Fluxo E2E offline: Jornada → primeiro combate → Linha Evolutiva.
# Pré-requisito: onboarding concluído. Não exige API, conta ou Liga.
appId: app.asdrafit.mobile
---
- launchApp
- tapOn: 'Jornada'
- assertVisible: 'Mapa da Jornada'
- tapOn: 'Espírito Errante'
- tapOn: 'Preparar batalha'
- assertVisible: 'Iniciar batalha'
- tapOn: 'Iniciar batalha'
# Espera o comando destravar em vez de adivinhar a duração do turno: 'Escolha sua
# ação' é o rótulo da fase `idle`, ou seja, o sinal preciso de "pronto para input".
# Sem isto, um turno mais longo faz o tap cair em botão desabilitado — com
# `optional: true` não falha, só não registra, e a batalha nunca termina.
- repeat:
    times: 16
    commands:
      - extendedWaitUntil:
          visible: 'Escolha sua ação'
          timeout: 12000
          optional: true
      - tapOn:
          text: 'Atacar'
          optional: true
      - tapOn:
          text: 'Continuar'
          optional: true
- tapOn:
    text: 'Voltar à jornada'
    optional: true
- tapOn: 'Meu Adari'
- tapOn: 'Status'
- tapOn: 'Linha Evolutiva'
- assertVisible: 'Linha Evolutiva'
- assertVisible: 'Brontar'
- assertNotVisible: 'Liga'
