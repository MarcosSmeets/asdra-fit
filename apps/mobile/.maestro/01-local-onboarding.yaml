# Fluxo E2E: primeira abertura → modo local → onboarding → escolher criatura.
# Requer device/emulador com o app instalado. Rode: maestro test .maestro/01-local-onboarding.yaml
appId: app.asdrafit.mobile
---
- launchApp:
    clearState: true
- assertVisible: 'Evolua junto com seu companheiro'
- tapOn: 'Começar'
- assertVisible: 'Asdra Fit'
- tapOn: 'Começar em modo local'
# Onboarding
- assertVisible: 'Nome ou apelido'
- tapOn:
    id: 'onboarding-name-input'
- inputText: 'Viajante'
- tapOn: 'Continuar'
- tapOn: 'Criar constância'
- tapOn: 'Continuar'
- tapOn: 'Musculação'
- tapOn: 'Continuar'
- assertVisible: 'Sua meta semanal'
- tapOn: 'Continuar' # meta padrão
- tapOn: 'Continuar' # dias
- assertVisible: 'Lembretes gentis'
- tapOn: 'Continuar' # notificações
- assertVisible: 'Escolha seu primeiro Adari'
- tapOn: 'Terravok'
- tapOn: 'Continuar'
- assertVisible: 'Tudo pronto!'
- tapOn: 'Concluir'
# Escolha entre conta e modo local. `optional` porque a tela redireciona sozinha
# quando EXPO_PUBLIC_ENABLE_ONLINE_FEATURES=false — assim o mesmo fluxo passa
# com a flag ligada ou desligada.
- tapOn:
    text: 'Continuar sem conta'
    optional: true
# Guia pós-onboarding
- assertVisible: 'Treine no mundo real'
- tapOn: 'Continuar'
- assertVisible: 'XP e treino viram progresso'
- tapOn: 'Continuar'
- assertVisible: 'Cuide e siga pela Jornada'
- tapOn: 'Continuar'
- assertVisible: 'Evolução exige constância'
- tapOn: 'Ir para Meu Adari'
# Área principal
- assertVisible: 'Registrar atividade'
