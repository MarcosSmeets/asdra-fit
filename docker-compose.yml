services:
  db:
    image: postgres:16-alpine
    container_name: adsidera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adsidera
      POSTGRES_PASSWORD: adsidera
      POSTGRES_DB: adsidera
    ports:
      # Host 5433 evita conflito com um PostgreSQL local em 5432.
      - '5433:5432'
    volumes:
      - adsidera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adsidera -d adsidera']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: adsidera-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://adsidera:adsidera@db:5432/adsidera?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_at_least_16_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_at_least_16_chars}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: info
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 120
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  adsidera_pgdata:
